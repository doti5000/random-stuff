<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No-AI Badge Domain Security Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #94a3b8;
            font-size: 18px;
        }
        .domain-title {
            color: #e2e8f0;
            font-weight: 800;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }
        .stat-value {
            font-size: 48px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 10px;
        }
        .stat-label {
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }
        
        .threats-section {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        .threats-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .threats-header h2 {
            margin: 0;
            font-size: 20px;
            color: #ef4444;
        }
        
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            color: #94a3b8;
            font-weight: 600;
            font-size: 14px;
            background: #0f172a;
        }
        td {
            font-size: 14px;
            color: #cbd5e1;
        }
        tr:last-child td {
            border-bottom: none;
        }
        
        .ip-badge {
            background: #ef444420;
            color: #ef4444;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        
        .no-data {
            padding: 40px;
            text-align: center;
            color: #94a3b8;
        }
        
        .loading {
            text-align: center;
            padding: 100px 20px;
            color: #94a3b8;
            font-size: 20px;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Generating Security Report...</div>
    
    <div id="content" class="container" style="display: none;">
        <div class="header">
            <h1>No-AI Badge Security Report</h1>
            <p>Protection metrics for <span id="domain-name" class="domain-title"></span></p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="views-count">0</div>
                <div class="stat-label">Human & Verified Bot Views</div>
            </div>
            <div class="stat-card" style="border-color: #ef444440;">
                <div class="stat-value" id="threats-count" style="color: #ef4444;">0</div>
                <div class="stat-label">AI Scrapers Blocked & Tarpitted</div>
            </div>
        </div>
        
        <div class="threats-section">
            <div class="threats-header">
                <h2>Threat Intelligence Log</h2>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Target IP</th>
                            <th>Bot User-Agent</th>
                        </tr>
                    </thead>
                    <tbody id="threats-body">
                        <!-- Filled dynamically -->
                    </tbody>
                </table>
            </div>
            <div id="no-threats" class="no-data" style="display: none;">
                No scraping attempts have been detected on this domain yet.
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            // Fallback to domain if url isn't provided for backwards compatibility
            const targetUrl = urlParams.get('url') || urlParams.get('domain');
            
            if (!targetUrl) {
                document.getElementById('loading').textContent = 'Error: No URL specified.';
                return;
            }
            
            document.getElementById('domain-name').textContent = targetUrl;
            
            try {
                // Send both url and domain to be safe during Vercel deployment cache transitions
                const response = await fetch(`/api/domain-stats?url=${encodeURIComponent(targetUrl)}&domain=${encodeURIComponent(targetUrl)}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);
                
                document.getElementById('views-count').textContent = (data.views || 0).toLocaleString();
                
                const threats = data.threats || [];
                document.getElementById('threats-count').textContent = threats.length.toLocaleString();
                
                const tbody = document.getElementById('threats-body');
                
                if (threats.length === 0) {
                    document.getElementById('no-threats').style.display = 'block';
                } else {
                    threats.forEach(t => {
                        const tr = document.createElement('tr');
                        
                        const tdTime = document.createElement('td');
                        tdTime.textContent = new Date(t.time).toLocaleString();
                        
                        const tdIp = document.createElement('td');
                        tdIp.innerHTML = `<span class="ip-badge">${t.ip || 'Unknown'}</span>`;
                        
                        const tdAgent = document.createElement('td');
                        tdAgent.textContent = t.userAgent || 'Unknown';
                        
                        tr.appendChild(tdTime);
                        tr.appendChild(tdIp);
                        tr.appendChild(tdAgent);
                        
                        tbody.appendChild(tr);
                    });
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
            } catch (err) {
                document.getElementById('loading').textContent = 'Failed to load report: ' + err.message;
            }
        });
    </script>
</body>
</html>
